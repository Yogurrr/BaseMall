spring.application.name=backend

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

jwt.expiration-ms=86400000

# 💡 DB 접속 정보/JWT 시크릿 같은 실제 값은 application-local.properties(gitignore 처리됨)에 둔다.
# 최초 실행 시 application-local.properties.example을 복사해서 application-local.properties로 만들고 값을 채울 것.
spring.profiles.active=local
