spring.application.name=backend

# 💡 이제 스키마는 Flyway(src/main/resources/db/migration)가 관리한다.
# validate는 엔티티와 실제 DB 스키마가 어긋나면 기동 시점에 바로 에러를 내서 알려준다.
# 새 컬럼/테이블이 필요하면 엔티티만 고치지 말고 V2, V3 ... 마이그레이션 파일을 추가할 것.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# 💡 기존에 ddl-auto=update로 이미 만들어져 있던 운영 DB(Supabase)를 위한 설정.
# flyway_schema_history 테이블이 없는 상태로 처음 붙으면, V1을 실제로 실행하는 대신
# "V1까지는 이미 적용된 것"으로 기록만 하고 넘어간다. 완전히 새로 만든 빈 DB에서는
# 이 옵션과 무관하게 V1이 정상적으로 실행되어 테이블을 생성한다.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

jwt.expiration-ms=3600000

# 💡 상품 이미지 업로드(Supabase Storage) 요청 크기 제한.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# 💡 DB 접속 정보/JWT 시크릿 같은 실제 값은 application-local.properties(gitignore 처리됨)에 둔다.
# 최초 실행 시 application-local.properties.example을 복사해서 application-local.properties로 만들고 값을 채울 것.
spring.profiles.active=local
