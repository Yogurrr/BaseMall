name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # 💡 BackendApplicationTests는 전체 스프링 컨텍스트를 띄우며 Supabase 접속 정보
      # (application-local.properties, gitignore 처리됨)가 필요한데 CI에는 없으므로,
      # 인프라 의존 없이 도는 Service 유닛테스트만 실행한다.
      - run: ./mvnw -B test "-Dtest=!BackendApplicationTests"

  frontend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
